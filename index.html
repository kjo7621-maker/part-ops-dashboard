<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>파트 운영 시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#F4F6FA;--card:#fff;--line:#E5E8EE;--line2:#F0F2F5;--text:#191F28;--sub:#4E5968;--muted:#8B95A1;
--pri:#3182F6;--pri-w:#E8F3FF;--red:#F04452;--red-w:#FFEEF0;--green:#0CA678;--green-w:#E6FCF5;--amber:#E8590C;--amber-w:#FFF4E6;
--violet:#7048E8;--violet-w:#F3F0FF;--gray-w:#F2F4F6;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:22px;margin:0;letter-spacing:-.02em} h2{font-size:18px;margin:0;letter-spacing:-.01em} h3{font-size:15px;margin:0}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)} .red{color:var(--red)!important} .center{text-align:center} .mt{margin-top:14px}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.empty{color:var(--muted);text-align:center;padding:20px 0;margin:0;font-size:13px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* 레이아웃 */
.side{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;z-index:20}
.brand{font-weight:800;font-size:16px;padding:4px 10px 18px;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--sub);font-weight:600}
.nav-item:hover{background:var(--gray-w)} .nav-item.on{background:var(--pri-w);color:var(--pri)}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line2)}
.me-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3} .me-txt small{color:var(--muted)}
.main{margin-left:220px;padding:28px 32px 64px;max-width:1340px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;color:var(--muted);font-weight:600;font-size:13px}

/* 카드·KPI */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi span{color:var(--sub);font-size:13px;font-weight:600} .kpi b{display:block;font-size:24px;letter-spacing:-.02em;margin:4px 0 2px}
.kpi small{color:var(--muted);font-size:12.5px} .kpi.warn b{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .grid21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.link{color:var(--pri);font-weight:600;font-size:13px;background:none;border:0;padding:0}

/* 버튼·폼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--gray-w)} .btn .ic{width:16px;height:16px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff} .btn.primary:hover{filter:brightness(.95)}
.btn.primary:disabled{opacity:.6;cursor:wait} .btn.danger{color:var(--red)} .btn.sm{padding:6px 10px;font-size:12.5px} .btn.block{width:100%;padding:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--sub)}
.icon-btn:hover{background:var(--gray-w)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:12.5px;color:var(--sub);font-weight:600}
input,select,textarea{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-w);border-color:var(--pri)}
input:disabled,select:disabled,textarea:disabled{background:var(--gray-w);color:var(--sub)}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:4px 0 8px;cursor:pointer} .check input{width:auto}
.sel{width:auto;padding:8px 10px}
.seg{display:inline-flex;background:#E9ECF1;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.yearsel{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 4px}
.yearsel b{padding:0 6px;min-width:84px;text-align:center}
.preview{background:var(--pri-w);color:#1B64DA;border-radius:10px;padding:10px 12px;font-size:13px;min-height:20px}
.preview:empty{display:none}

/* 배지·막대 */
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gray-w);color:var(--sub);white-space:nowrap}
.badge.warn{background:var(--amber-w);color:var(--amber)} .badge.bad{background:var(--red-w);color:var(--red)} .badge.good{background:var(--green-w);color:var(--green)}
.badge.blue{background:var(--pri-w);color:var(--pri)} .badge.violet{background:var(--violet-w);color:var(--violet)}
.bar{display:flex;height:8px;background:#EDF0F4;border-radius:99px;overflow:hidden} .bar.big{height:12px;margin-top:10px}
.bar i{display:block;height:100%;background:var(--pri)} .bar i.ghost{background:#B9D7FF}
.bar.ok i{background:var(--green)} .bar.mid i{background:#F59F00} .bar.over i{background:var(--red)}
.load{display:flex;align-items:center;gap:8px} .load .bar{flex:1} .load b{font-size:12.5px;min-width:40px;text-align:right}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.xs{width:18px;height:18px;font-size:10px} .person{display:flex;align-items:center;gap:8px} .person small{color:var(--muted)}

/* 목록 */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2)} .lrow:last-child{border-bottom:0}
.lrow.click{cursor:pointer;border-radius:8px} .lrow.click:hover{background:var(--gray-w)}
.lrow .t{flex:1;min-width:0} .lrow .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .t small{color:var(--muted)}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;background:#CED4DA} .pdot.hi{background:var(--red)} .pdot.md{background:#F59F00} .pdot.lo{background:#ADB5BD}

/* 업무 보드 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:#EBEEF3;border-radius:var(--r);padding:10px;min-height:260px;transition:outline .1s}
.col.over{outline:2px dashed var(--pri);outline-offset:-2px}
.col>header{display:flex;align-items:center;gap:8px;font-weight:700;padding:2px 4px 10px}
.col>header em{font-style:normal;color:var(--muted);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%} .s-todo{background:#ADB5BD} .s-doing{background:var(--pri)} .s-hold{background:#F59F00} .s-done{background:var(--green)}
.task{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;position:relative}
.task:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)} .task.late{border-left:3px solid var(--red)} .task.dragging{opacity:.4}
.task h4{margin:6px 0 8px;font-size:14px;font-weight:600;line-height:1.4;word-break:keep-all}
.task-top{display:flex;gap:6px;flex-wrap:wrap}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);align-items:center;padding-right:56px}
.task-meta .who{display:inline-flex;align-items:center;gap:4px}
.move{position:absolute;right:6px;bottom:6px;display:flex;gap:2px}
.mini{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--sub)}
.mini .ic{width:14px;height:14px} .mini:hover{background:var(--gray-w)}

/* 표 */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#FAFBFC}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0;background:#FAFBFC}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} .filters input{max-width:240px}

/* 휴가 */
.bal .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px} .bal .big small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.bal .label{font-weight:700}

/* 캘린더 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kdot{width:10px;height:10px;border-radius:3px;flex:none}
.k-leave{background:var(--violet-w);color:var(--violet)} .kdot.k-leave{background:var(--violet)}
.k-task{background:var(--pri-w);color:#1B64DA} .kdot.k-task{background:var(--pri)}
.k-league{background:var(--green-w);color:#087F5B} .kdot.k-league{background:var(--green)}
.k-event{background:var(--gray-w);color:var(--sub)} .kdot.k-event{background:#868E96}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow{padding:8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line)}
.day{min-height:112px;padding:6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.day:nth-child(7n){border-right:0} .day:hover{background:#FAFBFD} .day.out{background:#FBFBFC} .day.out .dn{color:#C5CCD3}
.dh{display:flex;align-items:center;gap:4px;margin-bottom:2px;min-width:0}
.dn{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-size:12.5px;font-weight:600;flex:none}
.day.today .dn{background:var(--pri);color:#fff!important}
.sun{color:var(--red)} .sat{color:var(--pri)}
.hol{font-size:11px;color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11.5px;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chip.done{text-decoration:line-through;opacity:.6} .more{font-size:11px;color:var(--muted);padding:2px 4px}
.dl-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px}
.dl-item.click{cursor:pointer} .dl-item.click:hover{background:var(--gray-w)}
.dl-item div{flex:1;min-width:0} .dl-item b{font-weight:600;display:block} .dl-item small{color:var(--muted)}

/* 매출 */
.chart-box{position:relative;height:260px;margin-top:10px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stage{background:var(--gray-w);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stage b{font-size:16px} .stage small{color:var(--muted)}
.st{font-size:12px;font-weight:700} .st-a{color:#868E96} .st-b{color:#F08C00} .st-c{color:var(--pri)} .st-d{color:var(--violet)} .st-e{color:var(--green)} .st-f{color:var(--red)}
.calc{background:var(--gray-w);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;margin-bottom:12px}

/* 모달·토스트 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal-card{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-card.wide{max-width:680px}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.m-foot{display:flex;gap:8px;align-items:center;margin-top:16px} .sp{flex:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#191F28;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)} #toast.err{background:var(--red)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;opacity:0;transition:opacity .2s}
#busy.on{opacity:1} #busy::after{content:'';position:absolute;inset:0;width:40%;background:var(--pri);animation:busy 1s infinite ease-in-out}
@keyframes busy{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* 로그인 */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:380px}
.auth-card h1{margin:14px 0 4px} .auth-card>p{margin:0 0 20px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}
.spinner{width:28px;height:28px;border:3px solid var(--pri-w);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 업무 상세 */
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipck{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px;cursor:pointer;background:#fff;font-weight:500}
.chipck input{width:auto;margin:0;accent-color:var(--pri)}
.chipck:has(input:checked){background:var(--pri-w);border-color:var(--pri);color:#1B64DA}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--gray-w);color:var(--sub)}
.sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;margin-top:4px}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.sec h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.ck{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:8px}
.ck:hover{background:var(--gray-w)} .ck input{width:auto;margin:0;accent-color:var(--green);width:16px;height:16px}
.ck span{flex:1;min-width:0;word-break:break-all} .ck.done span{text-decoration:line-through;color:var(--muted)}
.add-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap} .add-row input{flex:1;min-width:120px}
.lnk{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px} .lnk:hover{background:var(--gray-w)}
.lnk .ic{width:16px;height:16px;color:var(--muted)}
.lnk a{color:var(--pri);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line2)} .log:last-child{border-bottom:0}
.log .body{flex:1;min-width:0} .log .meta{font-size:12px;color:var(--muted)}
.log .txt{white-space:pre-wrap;word-break:break-word;margin-top:2px} .log.sys .txt{color:var(--sub);font-size:12.5px}
.log.sys .av{margin:0 7px}
.log-add{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px} .log-add textarea{flex:1}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog .bar{width:56px;height:6px}
.tbl td.title{white-space:normal;min-width:240px} .tbl td.title b{font-weight:600}
.tbl select.inline{padding:5px 8px;font-size:12.5px;width:auto;border-radius:8px}
.avs{display:inline-flex;margin-left:4px} .avs .av{margin-left:-5px;box-shadow:0 0 0 2px #fff} .avs .av:first-child{margin-left:0}
/* 프로젝트 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:12px} .pcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.pcard h3{font-size:16px;margin-bottom:2px} .pmeta{font-size:12.5px;color:var(--muted)} .pmeta b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:8px}
.back .ic{width:16px;height:16px}
.ms{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2)} .ms:last-of-type{border-bottom:0}
.ms input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)} .ms .t{flex:1;min-width:0} .ms.done .t b{text-decoration:line-through;color:var(--muted)}
.inline-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px} .inline-form input{flex:1;min-width:120px}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* 일정표 */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.g-inner{position:relative}
.g-row{display:flex;height:42px;border-bottom:1px solid var(--line2);position:relative}
.g-row:last-of-type{border-bottom:0}
.g-lab{position:sticky;left:0;z-index:3;background:#fff;flex:none;width:var(--lw);padding:0 12px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);cursor:pointer;min-width:0;line-height:1.3}
.g-lab b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .g-lab small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-tl{position:relative;flex:none}
.g-head{height:50px;background:#FAFBFC} .g-head .g-lab{background:#FAFBFC;cursor:default}
.g-months{position:absolute;top:0;left:0;height:24px;display:flex}
.g-months span{flex:none;font-size:11.5px;font-weight:700;color:var(--sub);padding:4px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.g-days{position:absolute;top:24px;left:0;height:26px;display:flex}
.g-days span{flex:none;text-align:center;font-size:11px;color:var(--muted);line-height:26px;font-variant-numeric:tabular-nums}
.g-days span.off{color:var(--red);opacity:.75}
.g-shade{position:absolute;top:0;bottom:0;background:rgba(25,31,40,.03);pointer-events:none;z-index:0}

let busyN = 0;
function setBusy(d){ busyN = Math.max(0, busyN + d); $('#busy').classList.toggle('on', busyN > 0); }
let toastT;
function toast(msg, type=''){ const el = $('#toast'); el.textContent = msg; el.className = 'show ' + type; clearTimeout(toastT); toastT = setTimeout(() => el.className = '', type === 'err' ? 3800 : 2400); }

async function api(action, payload={}){
  const body = new URLSearchParams({p: JSON.stringify(Object.assign({action, token:S.token}, payload))});
  let res;
  try { const r = await fetch(apiUrl(), {method:'POST', body}); res = await r.json(); }
  catch (e) { throw new Error('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
  if (!res.ok) {
    if (res.error === 'AUTH') { logout('로그인이 만료되었습니다. 다시 로그인해 주세요.'); throw new Error('AUTH'); }
    throw new Error(res.error || '요청을 처리하지 못했습니다.');
  }
  if (res.data) S.data = res.data;
  return res;
}

async function mutate(action, payload, msg){
  setBusy(1);
  try {
    await api(action, payload);
    S.calCache = {};
    closeModal(true);
    toast(msg || '저장했습니다');
    render();
    return true;
  } catch (e) {
    if (e.message !== 'AUTH') toast(e.message, 'err');
    return false;
  } finally { setBusy(-1); }
}

function logout(msg){
  S.token = null; S.data = null; LS.del('pw_token');
  closeModal(true); render();
  if (msg) toast(msg, 'err');
}

async function boot(){
  S.bootError = null; render();
  if (apiUrl() && S.token && !S.data) {
    try { await api('bootstrap'); }
    catch (e) { if (e.message !== 'AUTH') S.bootError = e.message; }
    render();
  }
}

function taskSort(a, b){
  const t = today();
  const la = a.dueDate && a.dueDate < t ? 0 : 1, lb = b.dueDate && b.dueDate < t ? 0 : 1;
  if (la !== lb) return la - lb;
  const da = a.dueDate || '9999', db = b.dueDate || '9999';
  if (da !== db) return da.localeCompare(db);
  return ['높음','보통','낮음'].indexOf(a.priority) - ['높음','보통','낮음'].indexOf(b.priority);
}
const parseJ = s => { if (Array.isArray(s)) return s; try { const v = JSON.parse(s || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const splitIds = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const checklistOf = x => parseJ(x.checklist);
const linksOf = x => parseJ(x.links);
const collabOf = x => splitIds(x.collaborators);
const tagsOf = x => splitIds(x.tags);
const ckProg = x => { const c = checklistOf(x); return c.length ? {done: c.filter(i => i.d).length, total: c.length} : null; };
const taskProgress = x => { if (x.status === '완료') return 1; const c = ckProg(x); return c ? c.done / c.total : 0; };
const commentCount = id => (S.data.logs || []).filter(l => l.taskId === id && l.kind === 'comment').length;
const avStack = ids => ids.length ? `<span class="avs">${ids.map(id => avatar(member(id), 'xs')).join('')}</span>` : '';
const allTags = () => [...new Set(S.data.tasks.flatMap(tagsOf))].sort();
const projOf = x => x.projectId ? S.data.projects.find(p => p.id === x.projectId) : null;
const fmtTime = s => { const d = String(s || ''); if (!d) return ''; return (d.slice(0, 10) === today() ? '오늘' : d.slice(5, 10).replace('-', '.')) + ' ' + d.slice(11, 16); };
const chatSeen = pid => num(LS.get('pw_cseen_' + pid));
const unreadOf = pid => { const s = (S.data.chatSummary || {})[pid]; return s ? Math.max(0, num(s.count) - chatSeen(pid)) : 0; };
const totalUnread = () => S.data.projects.reduce((n, p) => n + unreadOf(p.id), 0);
const canEditTask = x => { const me = S.data.me.id; return isLeader() || x.assigneeId === me || x.creatorId === me || collabOf(x).includes(me); };
const canEditProject = p => isLeader() || p.ownerId === S.data.me.id;

function leaveDaysIn(l, a, b){
  if (l.endDate < a || l.startDate > b) return 0;
  if (l.startDate === l.endDate) return num(l.days);
  return workdaysBetween(l.startDate > a ? l.startDate : a, l.endDate < b ? l.endDate : b);
}

/** 업무 부하 = 남은 공수(할 일·진행 중) ÷ 향후 2주 가용일(근무일 − 휴가) */
function memberLoads(){
  const t = today(), end = addD(t, 13), out = {};
  const base = workdaysBetween(t, end);
  activeMembers().forEach(m => {
    const open = S.data.tasks.filter(x => x.assigneeId === m.id && (x.status === '할 일' || x.status === '진행 중'));
    const effort = sum(open.map(x => num(x.effort)));
    const away = sum(S.data.leaves.filter(l => l.memberId === m.id).map(l => leaveDaysIn(l, t, end)));
    const cap = Math.max(0.5, base - away);
    out[m.id] = {open: open.length, effort: r2(effort), overdue: open.filter(x => x.dueDate && x.dueDate < t).length,
                 away: r2(away), cap: r2(cap), pct: Math.round(effort / cap * 100)};
  });
  return out;
}

function recommend(L){
  const t = today(), soon = addD(t, 2);
  const cands = activeMembers().filter(m => L[m.id] && !S.data.leaves.some(l => l.memberId === m.id && !(l.endDate < t || l.startDate > soon)));
  cands.sort((a, b) => L[a.id].pct - L[b.id].pct);
  return cands[0] || null;
}

function monthsOf(p){
  if (!p.startDate || !p.endDate) return [];
  const out = []; let y = +p.startDate.slice(0,4), m = +p.startDate.slice(5,7);
  const ey = +p.endDate.slice(0,4), em = +p.endDate.slice(5,7);
  while ((y < ey || (y === ey && m <= em)) && out.length < 120) { out.push([y, m]); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function allocYear(p, y, field='revenue'){
  const arr = Array(12).fill(0), ms = monthsOf(p);
  if (!ms.length) return arr;
  const per = num(p[field]) / ms.length;
  ms.forEach(([yy, mm]) => { if (yy === y) arr[mm-1] += per; });
  return arr;
}
const overlapYear = (p, y) => p.startDate && p.endDate && p.startDate <= `${y}-12-31` && p.endDate >= `${y}-01-01`;

function salesCalc(y){
  const st = S.data.meta.stages, conf = Array(12).fill(0), pipe = Array(12).fill(0);
  let cr = 0, cd = 0, ci = 0;
  S.data.projects.forEach(p => {
    const prob = st[p.stage] || 0; if (!prob) return;
    const a = allocYear(p, y);
    if (prob >= 1) {
      a.forEach((v, i) => conf[i] += v);
      cr += sum(a); cd += sum(allocYear(p, y, 'directCost')); ci += sum(allocYear(p, y, 'indirectCost'));
    } else a.forEach((v, i) => pipe[i] += v * prob);
  });
  const target = num(S.data.settings['salesTarget_' + y]);
  return {conf, pipe, target, confSum: sum(conf), pipeSum: sum(pipe), margin: pct(cr - cd, cr), margin2: pct(cr - cd - ci, cr)};
}

function filterTasks(list, ignoreStatus){
  const f = S.taskF, q = f.q.trim().toLowerCase();
  if (f.project) list = list.filter(x => x.projectId === f.project);
  if (!ignoreStatus) { if (f.status === 'open') list = list.filter(x => x.status !== '완료'); else if (f.status) list = list.filter(x => x.status === f.status); }
  if (f.tag) list = list.filter(x => tagsOf(x).includes(f.tag));
  if (q) list = list.filter(x => [x.title, x.desc, x.tags].join(' ').toLowerCase().includes(q));
  return list;
}

const PRI_ORDER = x => ['높음','보통','낮음'].indexOf(x.priority);
const SORTS = {
  due: taskSort,
  priority: (a, b) => (PRI_ORDER(a) - PRI_ORDER(b)) || taskSort(a, b),
  updated: (a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')),
  project: (a, b) => ((projOf(a) || {name:'힣'}).name).localeCompare((projOf(b) || {name:'힣'}).name) || taskSort(a, b)
};

      ? `<select class="inline" data-status="${x.id}" aria-label="상태">${ST.map(s => `<option ${s === x.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`

}

function gantt(tasks, milestones){
  const t = today();
  const items = tasks.filter(x => x.startDate || x.dueDate).map(x => {
    const s = x.startDate || x.dueDate; let e = x.dueDate || x.startDate; if (e < s) e = s; return {x, s, e};
  }).sort((a, b) => a.s.localeCompare(b.s) || a.e.localeCompare(b.e));
  const undated = tasks.length - items.length;
  if (!items.length && !milestones.length) return `<div class="card"><p class="empty">시작일이나 마감일이 있는 업무가 없습니다.</p></div>`;
  const dates = items.flatMap(i => [i.s, i.e]).concat(milestones.map(m => m.dueDate), [t]).sort();
  let start = addD(dates[0], -3);
  start = addD(start, -((pd(start).getDay() + 6) % 7));
  let end = addD(dates[dates.length - 1], 7);
  if (diffD(start, end) < 41) end = addD(start, 41);
  const days = diffD(start, end) + 1, DW = days > 100 ? 14 : 28, W = days * DW, LW = window.innerWidth < 640 ? 130 : 240;
  const pos = s => diffD(start, s) * DW;
  let months = '', cur = start;
  while (cur <= end) {
    const d = pd(cur), mEnd = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)), segEnd = mEnd < end ? mEnd : end;
    months += `<span style="width:${(diffD(cur, segEnd) + 1) * DW}px">${d.getFullYear() !== pd(t).getFullYear() ? d.getFullYear() + '. ' : ''}${d.getMonth() + 1}월</span>`;
    cur = addD(segEnd, 1);
  }
  let dayCells = '', shades = '';
  for (let i = 0; i < days; i++) {
    const ds = addD(start, i), dt = pd(ds), off = !isWorkday(ds);
    dayCells += `<span class="${off ? 'off' : ''}" style="width:${DW}px">${DW >= 20 || dt.getDay() === 1 ? dt.getDate() : ''}</span>`;
    if (off) shades += `<i class="g-shade" style="left:${LW + i * DW}px;width:${DW}px"></i>`;
  }
  const rows = items.map(({x, s, e}) => {
    const late = x.status !== '완료' && x.dueDate && x.dueDate < t, prog = Math.round(taskProgress(x) * 100), m = member(x.assigneeId);
    return `<div class="g-row"><div class="g-lab" data-act="editTask" data-id="${x.id}"><b>${esc(x.title)}</b><small>${esc(m.nickname)} · ${esc(x.status)}${prog ? ' · ' + prog + '%' : ''}</small></div>
      <div class="g-tl" style="width:${W}px"><div class="g-bar ${ST_CLS[x.status]} ${late ? 'late' : ''}" data-act="editTask" data-id="${x.id}" style="left:${pos(s) + 2}px;width:${(diffD(s, e) + 1) * DW - 4}px" title="${esc(x.title)} · ${fmtMD(s)} ~ ${fmtMD(e)}"><i style="width:${prog}%"></i><span>${esc(x.title)}</span></div></div></div>`;
  }).join('');
  const msRow = milestones.length ? `<div class="g-row"><div class="g-lab" style="cursor:default"><b>마일스톤</b><small>${milestones.length}개</small></div><div class="g-tl" style="width:${W}px">${milestones.map(m => `<span class="g-dia ${isTrue(m.done) ? 'done' : ''}" style="left:${pos(m.dueDate) + DW / 2 - 7}px" title="${esc(m.title)} · ${fmtMD(m.dueDate)}"></span>`).join('')}</div></div>` : '';
  const todayLine = t >= start && t <= end ? `<i class="g-today" style="left:${LW + pos(t) + DW / 2 - 1}px"></i>` : '';
  return `<div class="gantt"><div class="g-inner" style="width:${LW + W}px;--lw:${LW}px">
      <div class="g-row g-head"><div class="g-lab"><b>업무 ${items.length}건</b>${undated ? `<small>일정 미정 ${undated}건 제외</small>` : ''}</div><div class="g-tl" style="width:${W}px"><div class="g-months">${months}</div><div class="g-days">${dayCells}</div></div></div>
      ${msRow}${rows}${shades}${todayLine}</div></div>
    <p class="hint">막대 안 진한 부분은 진행률, 빨간 테두리는 마감이 지난 업무, 빨간 세로선은 오늘입니다. 막대를 누르면 상세가 열립니다.</p>`;
}

async function quiet(action, payload, msg){
  setBusy(1);
  try { await api(action, payload); S.calCache = {}; if (msg) toast(msg); render(); refreshModal(); return true; }
  catch (e) { if (e.message !== 'AUTH') toast(e.message, 'err'); render(); return false; }
  finally { setBusy(-1); }
}

/* ─── 공통: 복사 ─── */
function copyText(text, msg, selectEl){
  const fallback = () => {
    let ok = false;
    try {
      const ta = selectEl || document.createElement('textarea');
      if (!selectEl) { ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); }
      ta.focus(); ta.select(); ok = document.execCommand('copy');
      if (!selectEl) ta.remove();
    } catch (e) {}
    toast(ok ? msg : '복사하지 못했습니다. 선택된 내용을 직접 복사해 주세요', ok ? '' : 'err');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  else fallback();
}

/* ─── 자료실 ─── */
const libCats = () => S.data.meta.libCats || ['기안·계약','정산·증빙','기획·제안','방송·운영','리포트','양식·가이드','기타'];
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const fmtSize = n => { n = num(n); if (!n) return ''; return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; };
const MAX_UPLOAD = 10 * 1024 * 1024;

function fileType(url, title, mime){
  const u = String(url || ''), t = String(title || '').toLowerCase(), ext = (t.match(/\.([a-z0-9]{2,5})$/) || [])[1] || '';
  if (/docs\.google\.com\/spreadsheets/.test(u)) return ['시트', 'ft-green'];
  if (/docs\.google\.com\/document/.test(u)) return ['문서', 'ft-blue'];
  if (/docs\.google\.com\/presentation/.test(u)) return ['슬라이드', 'ft-amber'];
  if (/docs\.google\.com\/forms|forms\.gle/.test(u)) return ['설문', 'ft-violet'];
  if (ext === 'pdf' || /pdf/.test(mime || '')) return ['PDF', 'ft-red'];
  if (['xlsx','xls','csv'].includes(ext)) return ['엑셀', 'ft-green'];
  if (['hwp','hwpx'].includes(ext)) return ['한글', 'ft-blue'];
  if (['doc','docx'].includes(ext)) return ['워드', 'ft-blue'];
  if (['ppt','pptx','key'].includes(ext)) return ['PPT', 'ft-amber'];
  if (['png','jpg','jpeg','gif','webp','psd','ai','svg'].includes(ext)) return ['이미지', 'ft-violet'];
  if (['mp4','mov','avi','mkv'].includes(ext)) return ['영상', 'ft-violet'];
  if (['zip','rar','7z'].includes(ext)) return ['압축', 'ft-gray'];
  if (/drive\.google\.com/.test(u)) return ['드라이브', 'ft-gray'];
  return ['링크', 'ft-gray'];
}
const urlLabel = u => { const f = fileType(u)[0]; return f !== '링크' ? (/google/.test(hostOf(u)) ? '구글 ' : '') + f : (hostOf(u) || u); };

function allResources(){
  const d = S.data, out = [], seen = new Set();
  (d.library || []).forEach(l => {
    seen.add(l.url);
    out.push({key: 'L' + l.id, source: 'lib', id: l.id, kind: l.kind, title: l.title, url: l.url, category: l.category, projectId: l.projectId,
              memberId: l.memberId, createdAt: l.createdAt, pinned: isTrue(l.pinned), note: l.note, size: l.size, mime: l.mime});
  });
  d.tasks.forEach(t => linksOf(t).forEach((l, i) => {
    if (seen.has(l.url)) return; seen.add(l.url);
    out.push({key: 'T' + t.id + '_' + i, source: 'task', taskId: t.id, kind: 'link', title: l.title || urlLabel(l.url), url: l.url,
              projectId: t.projectId, memberId: t.creatorId, createdAt: t.updatedAt || t.createdAt, note: '업무: ' + t.title});
  }));
  (d.chatLinks || []).forEach((c, i) => {
    if (seen.has(c.url)) return; seen.add(c.url);
    out.push({key: 'C' + c.chatId + '_' + i, source: 'chat', chatId: c.chatId, kind: 'link', title: urlLabel(c.url), url: c.url,
              projectId: c.projectId, memberId: c.memberId, createdAt: c.createdAt, note: '채팅: ' + c.text});
  });
  return out.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
}

function resRow(r, opt={}){

  const meta = [r.source === 'lib' ? `<span class="badge">${esc(r.category || '기타')}</span>` : `<span class="badge violet">${r.source === 'task' ? '업무 첨부' : '채팅 공유'}</span>`,
    !opt.noProject && p ? `<span>${esc(p.name)}</span>` : '', `<span>${esc(member(r.memberId).nickname)}</span>`, `<span>${esc(fmtTime(r.createdAt))}</span>`,
    r.kind === 'file' ? `<span>${fmtSize(r.size)}</span>` : `<span>${esc(hostOf(r.url))}</span>`].filter(Boolean).join('');
  return `<div class="res"><a class="ft ${cls}" href="${esc(r.url)}" target="_blank" rel="noopener" aria-label="${esc(r.title)} 열기">${lab}</a>
    <div class="t"><a class="res-title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="res-meta">${meta}</div>${r.note ? `<div class="res-note">${esc(r.note)}</div>` : ''}</div>

      : `${r.source === 'task' ? `<button class="btn sm" data-act="editTask" data-id="${r.taskId}">업무 보기</button>` : ''}<button class="btn sm" data-act="libSave" data-key="${r.key}">자료실에 저장</button>`}</div></div>`;
}

function pinCard(r){

function libList(){
  const f = S.libF, q = f.q.trim().toLowerCase();
  let list = allResources();
  if (f.source) list = list.filter(r => r.source === f.source);
  if (f.cat) list = list.filter(r => r.source === 'lib' && r.category === f.cat);
  if (f.project) list = list.filter(r => r.projectId === f.project);
  if (f.kind) list = list.filter(r => r.kind === f.kind);
  if (q) list = list.filter(r => [r.title, r.url, r.note, r.category].join(' ').toLowerCase().includes(q));
  return list.length ? list.map(r => resRow(r)).join('') : '<p class="empty">조건에 맞는 자료가 없습니다.</p>';
}

const readB64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.onerror = () => rej(new Error('파일을 읽지 못했습니다.'));
  r.readAsDataURL(file);
});

function weekRange(off){
  const t = today(), mon = addD(t, -((pd(t).getDay() + 6) % 7) + off * 7);
  return {from: mon, to: addD(mon, 6), fri: addD(mon, 4), nFrom: addD(mon, 7), nTo: addD(mon, 13), nFri: addD(mon, 11)};
}

function buildReport(R, mode, ids, note){
  const d = S.data, t = today(), md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`, mdw = s => `${md(s)}(${DOW[pd(s).getDay()]})`;
  const pn = x => { const p = projOf(x); return p ? p.name : ''; };
  const inR = (s, a, b) => !!s && s >= a && s <= b;
  const mine = d.tasks.filter(x => ids.includes(x.assigneeId));
  const isDone = x => x.status === '완료' && inR(String(x.completedAt || '').slice(0, 10), R.from, R.to);
  const isDoing = x => x.status === '진행 중';
  const isLate = x => x.status !== '완료' && x.dueDate && x.dueDate < t;
  const isNext = x => x.status === '할 일' && !isLate(x) && ((x.dueDate && x.dueDate <= R.nTo) || (x.startDate && x.startDate <= R.nTo));
  const isIssue = x => x.status === '보류' || isLate(x);
  const tail = (x, kind, who) => {
    const proj = mode === 'person' && pn(x) ? ` (${pn(x)})` : '', w = who ? ` - ${member(x.assigneeId).nickname}` : '';
    if (kind === 'doing') { const pr = Math.round(taskProgress(x) * 100); return `${proj}${pr ? ` ${pr}%` : ''}${x.dueDate ? ` ~${md(x.dueDate)}` : ''}${w}`; }
    if (kind === 'next') return `${proj}${x.dueDate ? ` ~${md(x.dueDate)}` : ''}${w}`;
    if (kind === 'issue') return `${proj}: ${x.status === '보류' ? '보류' : `마감 ${md(x.dueDate)} 지남`}${w}`;
    return `${proj}${w}`;
  };
  const sec = (label, list, kind, who) => list.length ? [`- ${label}`].concat(list.sort(taskSort).map(x => `  · ${x.title}${tail(x, kind, who)}`)) : [];
  const leavesOf = mid => d.leaves.filter(l => l.memberId === mid && !(l.endDate < R.from || l.startDate > R.nTo)).sort((a, b) => a.startDate.localeCompare(b.startDate))
    .map(l => `${l.startDate === l.endDate ? mdw(l.startDate) : `${mdw(l.startDate)}~${mdw(l.endDate)}`} ${l.type === '병가' ? '휴가' : l.type}`);
  const c = {done: mine.filter(isDone).length, doing: mine.filter(isDoing).length, next: mine.filter(isNext).length, late: mine.filter(isLate).length};
  const lines = [`[주간보고] ${mdw(R.from)} ~ ${mdw(R.fri)}${ids.length === 1 ? ' · ' + member(ids[0]).nickname : ''}`, `완료 ${c.done}건 · 진행 ${c.doing}건 · 예정 ${c.next}건${c.late ? ` · 지연 ${c.late}건` : ''}`];
  if (mode === 'project') {
    const groups = {};
    mine.forEach(x => { const k = x.projectId && projOf(x) ? x.projectId : ''; (groups[k] = groups[k] || []).push(x); });
    const gname = k => k ? projOf({projectId: k}).name : '';
    Object.keys(groups).sort((a, b) => ((a ? 0 : 1) - (b ? 0 : 1)) || gname(a).localeCompare(gname(b))).forEach(k => {
      const ts = groups[k];
      const body = [].concat(sec('완료', ts.filter(isDone), 'done', true), sec('진행', ts.filter(isDoing), 'doing', true), sec(`예정 (~${md(R.nFri)})`, ts.filter(isNext), 'next', true), sec('이슈', ts.filter(isIssue), 'issue', true));
      const ms = k ? (d.milestones || []).filter(m => m.projectId === k && !isTrue(m.done) && inR(m.dueDate, R.from, R.nTo)).sort((a, b) => a.dueDate.localeCompare(b.dueDate)) : [];
      if (!body.length && !ms.length) return;
      lines.push('', `■ ${k ? projOf({projectId: k}).name : '기타 업무'}`);
      if (ms.length) lines.push(`- 일정: ${ms.map(m => `${m.title} ${mdw(m.dueDate)}`).join(', ')}`);
      lines.push(...body);
    });
    const away = ids.map(id => ({id, ls: leavesOf(id)})).filter(a => a.ls.length);
    if (away.length) lines.push('', '■ 부재', ...away.map(a => `- ${member(a.id).nickname}: ${a.ls.join(', ')}`));
  } else {
    ids.forEach(id => {
      const m = member(id), ts = mine.filter(x => x.assigneeId === id), ls = leavesOf(id);
      const body = [].concat(sec('완료', ts.filter(isDone), 'done'), sec('진행', ts.filter(isDoing), 'doing'), sec(`예정 (~${md(R.nFri)})`, ts.filter(isNext), 'next'), sec('이슈', ts.filter(isIssue), 'issue'));
      lines.push('', `■ ${m.nickname}${m.position ? ' ' + m.position : ''}`, ...(body.length ? body : ['- 특이사항 없음']));
      if (ls.length) lines.push(`- 부재: ${ls.join(', ')}`);
    });
  }
  const extra = String(note || '').trim();
  if (extra) lines.push('', '■ 기타 공유사항', ...extra.split('\n').map(s => s.trim()).filter(Boolean).map(s => /^[-·•]/.test(s) ? s : `- ${s}`));
  return {text: lines.join('\n'), c};
}

/* 팀 주간 업무보고 (2026_New 탭): 담당자 | 프로젝트 (명칭) | 개요 및 매출/수익률 | (금주) 주요 추진 업무 | 주요 체크사항 | ETA | STATUS */
const REP_COLS = ['담당자', '프로젝트 (명칭)', '개요 및 매출/수익률', '(금주) 주요 추진 업무', '주요 체크사항', 'ETA', 'STATUS'];
const dShort = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}(${DOW[pd(s).getDay()]})`;
const dLong = s => `${s.slice(0, 4)}.${s.slice(5, 7)}.${s.slice(8, 10)}(${DOW[pd(s).getDay()]})`;
const repTeamScope = () => S.repTeamScope || (isLeader() ? 'all' : 'mine');
const repDateOf = R => S.repDates[R.from] || addD(R.from, 3);

function projOverview(p){
  const lines = ['[개요]'], sch = String(p.schedule || '').trim();
  if (sch.includes('\n')) lines.push(...sch.split('\n'));
  else lines.push(`- 일정 : ${sch || (p.startDate && p.endDate ? `${dLong(p.startDate)} ~ ${dLong(p.endDate)}` : '미정')}`);
  if (p.venue) lines.push(`- 장소 : ${p.venue}`);
  const r = num(p.revenue), m = r ? Math.round((r - num(p.directCost)) / r * 100) : null;
  lines.push('', '[매출 / 수익률]', `- 매출 : ${r ? won(r) : '미정'}`, `- 수익률 : ${m == null ? '미정' : m + '%' + (p.stage === '완료' ? '' : ' 예상')}`);
  return lines.join('\n');
}

function buildTeamReport(R, scope){
  const d = S.data, t = today(), me = d.me.id, inR = s => !!s && s >= R.from && s <= R.to;
  const roster = activeMembers().map(m => m.id), ord = id => { const i = roster.indexOf(id); return i < 0 ? 99 : i; };
  let ps = d.projects.filter(p => p.stage !== '실주');
  if (scope === 'mine') ps = ps.filter(p => p.ownerId === me || d.tasks.some(x => x.projectId === p.id && (x.assigneeId === me || collabOf(x).includes(me))));
  const rows = [], skipped = [];
  ps.slice().sort((a, b) => (a.startDate || '').localeCompare(b.startDate || '')).forEach(p => {
    const ts = d.tasks.filter(x => x.projectId === p.id);
    const done = ts.filter(x => x.status === '완료' && inR(String(x.completedAt || '').slice(0, 10)));
    const doing = ts.filter(x => x.status === '진행 중');
    const todo = ts.filter(x => x.status === '할 일' && !(x.dueDate && x.dueDate < R.from) && ((x.dueDate && x.dueDate <= R.to) || (x.startDate && x.startDate <= R.to)));
    const ms = (d.milestones || []).filter(m => m.projectId === p.id).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    const items = [];
    done.concat(doing, todo).forEach(x => {
      const dt = inR(x.dueDate) ? x.dueDate : (x.status === '할 일' && inR(x.startDate)) ? x.startDate : '';
      let line = `- ${dt ? dShort(dt) + ' ' : ''}${x.title}`;
      if (x.status === '완료') line += ' (완료)';
      else if (!dt && x.dueDate && x.dueDate > R.to) line += ` (~${+x.dueDate.slice(5, 7)}/${+x.dueDate.slice(8, 10)})`;
      items.push({k: (dt || '9999') + (x.status === '완료' ? '0' : '1'), line});
    });
    ms.filter(m => inR(m.dueDate)).forEach(m => items.push({k: m.dueDate + '0', line: `- ${dShort(m.dueDate)} ${m.title}${isTrue(m.done) ? ' (완료)' : ''}`}));
    items.sort((a, b) => a.k.localeCompare(b.k));
    const work = [...new Set(items.map(i => i.line))];
    const checks = ms.filter(m => !isTrue(m.done) && m.dueDate > R.to).slice(0, 2).map(m => `${dShort(m.dueDate)} ${m.title}`);
    const late = ts.filter(x => x.status !== '완료' && x.dueDate && x.dueDate < t).map(x => `지연: ${x.title} (${+x.dueDate.slice(5, 7)}/${+x.dueDate.slice(8, 10)} 마감)`);
    const hold = ts.filter(x => x.status === '보류').map(x => `보류: ${x.title}`);
    if (!work.length && !late.length && !hold.length) { if (p.stage !== '완료') skipped.push(p.name); return; }
    const who = new Set([p.ownerId]);
    done.concat(doing, todo).forEach(x => { who.add(x.assigneeId); collabOf(x).forEach(id => who.add(id)); });
    const names = [...who].filter(id => roster.includes(id)).sort((a, b) => ord(a) - ord(b)).map(id => member(id).nickname);
    rows.push([names.join(', '), p.name, projOverview(p), work.join('\n'), checks.concat(late, hold).join('\n'), '', '']);
  });
  return {rows, skipped};
}

async function copyGrid(grid, msg){
  const html = '<meta charset="utf-8"><table>' + grid.map(r => '<tr>' + r.map(c => `<td>${esc(c).replace(/\n/g, '<br>')}</td>`).join('') + '</tr>').join('') + '</table>';
  const tsv = grid.map(r => r.map(c => /[\t\n"]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join('\t')).join('\n');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([tsv], {type: 'text/plain'})})]);
      return toast(msg);
    }
  } catch (e) {}
  const div = document.createElement('div');
  div.innerHTML = html; div.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(div);
  const range = document.createRange(), sel = window.getSelection();
  range.selectNodeContents(div); sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges(); div.remove();
  toast(ok ? msg : '복사하지 못했습니다. 표를 직접 드래그해서 복사해 주세요', ok ? '' : 'err');
}

/* ─── 프로젝트 채팅 ─── */
const chatActive = () => !!(S.data && S.route.startsWith('project-') && S.projTab === 'chat');
const nowStr = () => { const d = new Date(); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

function fmtChat(t){
  let h = esc(t).replace(/(https?:\/\/[^\s<]+?)(?=&quot;|&#39;|\s|<|$)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const names = S.data.members.map(m => m.nickname).filter(Boolean).sort((a, b) => b.length - a.length).map(n => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (names.length) h = h.replace(new RegExp('@(' + names.join('|') + ')', 'g'), (m0, n) => `<span class="mention ${n === esc(S.data.me.nickname) ? 'me-m' : ''}">@${n}</span>`);
  return h;
}

function drawChat(stick){
  const box = $('#chatList');
  if (!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const me = S.data.me.id, list = S.chat.msgs;
  if (!S.chat.loaded) { box.innerHTML = '<div class="c-empty">불러오는 중…</div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="c-empty">아직 대화가 없습니다.<br>프로젝트 관련 공유 사항을 남겨 보세요.</div>'; return; }
  let html = '', lastDate = '', lastWho = '', lastMin = '';
  list.forEach(c => {
    const d = String(c.createdAt).slice(0, 10), min = String(c.createdAt).slice(0, 16), m = member(c.memberId), mine = c.memberId === me;
    if (d !== lastDate) { const dt = pd(d); html += `<div class="c-date">${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 ${DOW[dt.getDay()]}요일</div>`; lastDate = d; lastWho = ''; }
    const cont = lastWho === c.memberId && lastMin === min;
    html += `<div class="c-msg ${mine ? 'me' : ''} ${cont ? 'cont' : ''} ${c.pending ? 'pending' : ''}">${mine ? '' : (cont ? '<span class="c-gap"></span>' : avatar(m))}
      <div class="c-body">${!mine && !cont ? `<div class="c-name">${esc(m.nickname)}</div>` : ''}<div class="c-line"><div class="c-bubble" data-act="chatOpen">${fmtChat(c.text)}</div><span class="c-time">${c.pending ? '전송 중' : min.slice(11)}</span>
      ${c.pending ? '' : `<span class="c-acts">${c.taskId ? '' : `<button class="c-act" data-act="chatToTask" data-id="${c.id}" title="이 메시지로 업무 등록">업무로</button>`}${mine || isLeader() ? `<button class="c-del" data-act="chatDel" data-id="${c.id}" title="삭제" aria-label="메시지 삭제">${icon('x')}</button>` : ''}</span>`}</div>
      ${c.taskId ? (() => { const x = S.data.tasks.find(y => y.id === c.taskId); return x ? `<button class="c-task" data-act="editTask" data-id="${x.id}">${icon('check')}<span>업무 등록됨</span><b>${esc(x.title)}</b><span>· ${esc(member(x.assigneeId).nickname)} · ${esc(x.status)}</span></button>` : '<span class="c-task">등록했던 업무가 삭제되었습니다</span>'; })() : ''}</div></div>`;
    lastWho = c.memberId; lastMin = min;
  });
  box.innerHTML = html;
  if (stick || nearBottom) box.scrollTop = box.scrollHeight;
}

function mergeChat(r, replace){
  const pend = S.chat.msgs.filter(c => c.pending);
  let msgs = replace ? [] : S.chat.msgs.filter(c => !c.pending);
  const ids = new Set(msgs.map(c => c.id));
  (r.messages || []).forEach(c => { if (!ids.has(c.id)) { msgs.push(c); ids.add(c.id); } });
  msgs.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  S.chat.msgs = msgs.concat(pend.filter(p => !msgs.some(c => c.memberId === p.memberId && c.text === p.text && c.createdAt >= p.createdAt.slice(0, 16))));
  if (msgs.length) S.chat.since = msgs[msgs.length - 1].createdAt;
  S.chat.count = num(r.count);
  S.chat.loaded = true;
  markChatRead();
}

function markChatRead(){
  const pid = S.chat.pid;
  if (!pid || !chatActive()) return;
  LS.set('pw_cseen_' + pid, String(S.chat.count));
  const sm = S.data.chatSummary || (S.data.chatSummary = {});
  sm[pid] = {count: S.chat.count, last: S.chat.since};
  const nav = document.querySelector('.nav-item[href="#projects"] .nbadge'), t = totalUnread();
  if (nav) { if (t) nav.textContent = t; else nav.remove(); }
}

async function startChat(pid){
  S.chat = {pid, msgs: [], since: '', count: 0, loaded: false};
  drawChat(true);
  try { mergeChat(await api('chatPoll', {projectId: pid, since: ''}), true); }
  catch (e) { if (e.message !== 'AUTH') toast('채팅을 불러오지 못했습니다: ' + e.message, 'err'); S.chat.loaded = true; }
  if (S.chat.pid === pid) drawChat(true);
  if (!S.chatTimer) S.chatTimer = setInterval(chatTick, 8000);
}

function stopChat(){ if (S.chatTimer) { clearInterval(S.chatTimer); S.chatTimer = null; } }

async function chatTick(){
  if (!chatActive() || S.chat.pid !== S.projectId) return stopChat();
  if (document.visibilityState !== 'visible' || S.chat.polling || S.chat.sending) return;
  S.chat.polling = true;
  const pid = S.chat.pid;
  try { const r = await api('chatPoll', {projectId: pid, since: S.chat.since}); if (S.chat.pid === pid) { const before = S.chat.msgs.length; mergeChat(r); if (S.chat.msgs.length !== before) drawChat(false); } }
  catch (e) {}
  finally { S.chat.polling = false; }
}

async function sendChat(){
  const el = $('#chatInput'), text = el ? el.value.trim() : '';
  if (!text || S.chat.sending) return;
  const pid = S.chat.pid;
  S.chat.sending = true; el.value = ''; S.chatDraft = ''; el.style.height = '';
  S.chat.msgs.push({id: 'tmp' + Date.now(), projectId: pid, memberId: S.data.me.id, text, createdAt: nowStr(), pending: true});
  drawChat(true);
  try { const r = await api('sendChat', {data: {projectId: pid, text}, since: S.chat.since}); if (S.chat.pid === pid) { S.chat.msgs = S.chat.msgs.filter(c => !c.pending); mergeChat(r); drawChat(true); } }
  catch (e) {
    S.chat.msgs = S.chat.msgs.filter(c => !c.pending); drawChat(true);
    const n = $('#chatInput'); if (n) n.value = text;
    if (e.message !== 'AUTH') toast(e.message, 'err');
  }
  finally { S.chat.sending = false; }
}

/** 메시지에서 마감일 추정: 11/3, 11월 3일, 오늘·내일·모레, (다음 주) 금요일 */
function parseDue(text){
  const t0 = today(), t = pd(t0), body = text.replace(/https?:\/\/\S+/g, ' ');
  const mk = (mo, d) => { if (mo < 1 || mo > 12 || d < 1 || d > 31) return ''; let s = ymd(new Date(t.getFullYear(), mo - 1, d)); if (s < addD(t0, -60)) s = ymd(new Date(t.getFullYear() + 1, mo - 1, d)); return s; };
  let m;
  if ((m = body.match(/(\d{1,2})월\s*(\d{1,2})일/))) return mk(+m[1], +m[2]);
  if ((m = body.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?!\d)/))) return mk(+m[1], +m[2]);
  if (/모레/.test(body)) return addD(t0, 2);
  if (/내일/.test(body)) return addD(t0, 1);
  if (/오늘/.test(body)) return t0;
  if ((m = body.match(/(다음\s*주\s*)?([월화수목금토일])요일/))) {
    const target = DOW.indexOf(m[2]);
    if (m[1]) { const toMon = 7 - ((t.getDay() + 6) % 7); return addD(t0, toMon + (target + 6) % 7); }
    return addD(t0, (target - t.getDay() + 7) % 7);
  }
  return '';
}

/* ─── 프로젝트 ─── */
function projStats(p){
  const t = today(), ts = S.data.tasks.filter(x => x.projectId === p.id);
  const w = x => num(x.effort) || 1, tot = sum(ts.map(w)), done = sum(ts.map(x => w(x) * taskProgress(x)));
  const open = ts.filter(x => x.status !== '완료'), late = open.filter(x => x.dueDate && x.dueDate < t).length;
  const ms = (S.data.milestones || []).filter(m => m.projectId === p.id).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const next = ms.find(m => !isTrue(m.done));
  const members = [...new Set([p.ownerId].concat(ts.flatMap(x => [x.assigneeId].concat(collabOf(x)))))].filter(id => S.data.members.some(m => m.id === id));
  return {ts, pct: tot ? Math.round(done / tot * 100) : 0, open: open.length, late, ms, next, members};
}

function healthBadge(p, s){
  const t = today();
  if (p.stage === '완료') return '<span class="badge good">완료</span>';
  if (p.stage === '실주') return '<span class="badge">실주</span>';
  if (p.endDate && p.endDate < t) return '<span class="badge bad">기간 초과</span>';
  if (s.late) return `<span class="badge bad">지연 ${s.late}건</span>`;
  if (s.next && s.next.dueDate < t) return '<span class="badge warn">마일스톤 지연</span>';
  return '<span class="badge good">정상</span>';
}

async function setTaskStatus(x, st){
  if (!x || x.status === st) return;
  if (!canEditTask(x)) return toast('담당하거나 참여한 업무만 바꿀 수 있습니다', 'err');
  const prev = x.status; x.status = st; render();
  const ok = await quiet('patchTask', {data:{id: x.id, status: st}}, `'${st}'(으)로 바꿨습니다`);
  if (!ok) { x.status = prev; render(); }
}

function pickCompClient(records, days, preferred){
  const order = records.filter(r => num(r.remain) > 0).slice().sort((a, b) => (a.workDate === preferred ? 0 : 1) - (b.workDate === preferred ? 0 : 1));
  const out = []; let need = days;
  order.forEach(r => { if (need <= 0) return; need = r2(need - Math.min(num(r.remain), need)); if (!out.includes(r.workDate)) out.push(r.workDate); });
  return out;
}

const gridStart = (y, m) => { const f = new Date(y, m, 1); return ymd(new Date(y, m, 1 - f.getDay())); };

function buildCalMap(from, to, events){
  const map = {}, ids = new Set(), me = S.data.me;
  const push = (d, it) => { (map[d] = map[d] || []).push(it); };
  S._holExtra = {};
  S.data.leaves.forEach(l => {
    if (l.calEventId) ids.add(l.calEventId);
    if (l.endDate < from || l.startDate > to) return;
    eachDay(l.startDate > from ? l.startDate : from, l.endDate < to ? l.endDate : to, d => {
      if (l.startDate !== l.endDate && !isWorkday(d)) return;
      push(d, {kind:'leave', title:`${member(l.memberId).nickname} ${l.type}`, sub: leaveRange(l)});
    });
  });
  S.data.tasks.forEach(t => {
    if (t.calEventId) ids.add(t.calEventId);
    if (!t.dueDate || t.dueDate < from || t.dueDate > to) return;
    if (!isTrue(t.onCalendar) && t.assigneeId !== me.id) return;
    push(t.dueDate, {kind:'task', title: t.title, sub: `${member(t.assigneeId).nickname} · ${t.status}`, id: t.id, done: t.status === '완료'});
  });
  (S.data.milestones || []).forEach(m => {
    if (m.calEventId) ids.add(m.calEventId);
    if (m.dueDate < from || m.dueDate > to) return;
    const p = S.data.projects.find(x => x.id === m.projectId);
    push(m.dueDate, {kind:'ms', title: m.title, sub: p ? p.name : '', done: isTrue(m.done)});
  });
  const tags = activeMembers().flatMap(m => [m.nickname, m.calName].filter(Boolean).map(n => '[' + n.trim() + ']'));
  (events || []).forEach(ev => {
    if (ev.source === 'holiday') { eachDay(ev.start, ev.end, d => S._holExtra[d] = ev.title); return; }
    if (ids.has(ev.id)) return;
    if (ev.source === 'leavecal') {
      const t = String(ev.title).trim();
      if (!tags.some(g => t.indexOf(g) === 0)) return;
      eachDay(ev.start > from ? ev.start : from, ev.end < to ? ev.end : to, d => { if (ev.start === ev.end || isWorkday(d)) push(d, {kind: 'leave', title: t.replace(/^\[([^\]]+)\]\s*/, '$1 '), sub: leaveCalName()}); });
      return;
    }
    eachDay(ev.start > from ? ev.start : from, ev.end < to ? ev.end : to, d => push(d, {kind: ev.source === 'league' ? 'league' : 'event', title: (ev.time ? ev.time + ' ' : '') + ev.title}));
  });
  return map;
}

async function loadCalendar(){
  const {y, m} = S.cal, key = `${y}-${m}`;
  if (S.calCache[key] || S.calLoading === key) return;
  S.calLoading = key;
  const gs = gridStart(y, m);
  try { const r = await api('calendar', {start: gs, end: addD(gs, 41)}); S.calCache[key] = r.events || []; }
  catch (e) { S.calCache[key] = []; if (e.message !== 'AUTH') toast('구글 캘린더를 불러오지 못했습니다: ' + e.message, 'err'); }
  finally { S.calLoading = null; }
  if (S.data && S.route === 'calendar' && S.cal.y === y && S.cal.m === m) render();
}

function salesTable(){
  const y = S.salesYear, f = S.salesFilter, q = f.q.trim().toLowerCase();
  let ps = S.data.projects.filter(p => overlapYear(p, y));
  if (f.stage) ps = ps.filter(p => p.stage === f.stage);
  if (f.type) ps = ps.filter(p => p.type === f.type);
  if (f.owner) ps = ps.filter(p => p.ownerId === f.owner);
  if (q) ps = ps.filter(p => [p.name, p.client, p.clientGroup, p.code].join(' ').toLowerCase().includes(q));
  ps.sort((a, b) => b.startDate.localeCompare(a.startDate));
  if (!ps.length) return `<p class="empty">${y}년에 해당하는 프로젝트가 없습니다.</p>`;
  const T = {r:0, dc:0, ic:0};
  const rows = ps.map(p => {
    const r = num(p.revenue), dc = num(p.directCost), ic = num(p.indirectCost);
    if (p.stage !== '실주') { T.r += r; T.dc += dc; T.ic += ic; }
    return `<tr class="click" data-act="editProject" data-id="${p.id}"><td class="muted">${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.clientGroup || p.client)}</td><td>${esc(p.type)}</td>
      <td>${esc(member(p.ownerId).nickname)}</td><td><span class="st st-${STAGE_CLS[p.stage] || 'a'}">${esc(p.stage)}</span></td><td class="muted">${p.startDate.slice(2).replace(/-/g,'.')} ~ ${p.endDate.slice(2).replace(/-/g,'.')}</td>
      <td class="num">${won(r)}</td><td class="num">${won(dc)}</td><td class="num">${won(r - dc)}</td><td class="num">${pct(r - dc, r)}%</td><td class="num">${pct(r - dc - ic, r)}%</td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>코드</th><th>프로젝트</th><th>광고주</th><th>유형</th><th>담당</th><th>단계</th><th>매출 인식 기간</th><th class="num">매출</th><th class="num">직접비</th><th class="num">수익(직접)</th><th class="num">수익률</th><th class="num">간접비 포함</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td colspan="7">합계 (실주 제외, 프로젝트 전체 금액)</td><td class="num">${won(T.r)}</td><td class="num">${won(T.dc)}</td><td class="num">${won(T.r - T.dc)}</td><td class="num">${pct(T.r - T.dc, T.r)}%</td><td class="num">${pct(T.r - T.dc - T.ic, T.r)}%</td></tr></tfoot></table></div>`;
}

function openModal(html, opt={}){
  const m = $('#modal'), c = $('#modalCard');
  m.dataset.locked = opt.locked ? '1' : '';
  c.className = 'modal-card' + (opt.wide ? ' wide' : '');
  c.innerHTML = html;
  m.classList.remove('hidden');
  const f = c.querySelector('form');
  if (f && f.dataset.form === 'leave') updateLeavePreview(f);
  if (f && f.dataset.form === 'project') updateProjectCalc(f);
  if (c.querySelector('#ckBox')) drawDraft();
  setTimeout(() => { const el = c.querySelector('input:not([type=hidden]):not([disabled]):not([readonly])'); if (el && window.innerWidth > 860) el.focus(); }, 30);
}
function closeModal(force){
  const m = $('#modal');
  if (m.dataset.locked && !force) return;
  m.dataset.locked = ''; m.classList.add('hidden'); $('#modalCard').innerHTML = ''; S.draft = null;
}

const FORMS = {
  api: o => {
    const u = String(o.url || '').trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast('Apps Script 웹앱 URL(…/exec)을 입력해 주세요', 'err');
    LS.set('pw_api', u); render();
  },
  login: async o => {
    setBusy(1);
    try {
      const r = await api('login', {nickname: o.nickname.trim(), pin: o.pin});
      S.token = r.token; LS.set('pw_token', r.token); LS.set('pw_nick', o.nickname.trim());
      S.route = 'home'; history.replaceState(null, '', '#home'); render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(-1); }
  },
  pin: o => { if (o.next !== o.confirm) return toast('새 PIN이 서로 다릅니다', 'err'); return mutate('changePin', {data:{current: o.current, next: o.next}}, 'PIN을 변경했습니다'); },
  task: o => { if (S.draft) { o.checklist = S.draft.checklist; o.links = S.draft.links; } if (o.fromChat) S.chat.loaded = false; return mutate('saveTask', {data:o}, o.id ? '업무를 저장했습니다' : '업무를 추가했습니다'); },
  milestone: o => mutate('saveMilestone', {data:o}, '마일스톤을 추가했습니다'),
  lib: async o => {
    if (S.libMode === 'file' && !o.id) {
      const f = S.libFile;
      if (!f) return toast('파일을 선택해 주세요', 'err');
      if (f.size > MAX_UPLOAD) return toast('10MB 이하 파일만 올릴 수 있습니다', 'err');
      toast('업로드 중입니다…');
      let b64;
      try { b64 = await readB64(f); } catch (e) { return toast(e.message, 'err'); }
      return mutate('uploadFile', {data: Object.assign({}, o, {fileName: f.name, mime: f.type || 'application/octet-stream', base64: b64})}, '파일을 올렸습니다');
    }
    return mutate('saveLibrary', {data: o}, o.id ? '자료를 저장했습니다' : '자료를 등록했습니다');
  },
  contact: o => mutate('saveContact', {data: o}, o.id ? '연락처를 저장했습니다' : '연락처를 추가했습니다'),
  tpl: () => {
    const T = S.tpl;
    if (!T.items.some(i => String(i.title).trim())) return toast('업무명을 1개 이상 입력해 주세요', 'err');
    return mutate('saveTemplate', {data: {id: T.id, name: T.name, desc: T.desc, baseLabel: T.baseLabel, items: T.items}}, '템플릿을 저장했습니다')
      .then(ok => { if (ok) openModal(tplListHtml(S.tplProject), {wide: true}); });
  },
  tplApply: o => {
    const rows = tplComputed(), n = rows.filter(r => r.on).length;
    if (!n) return toast('만들 업무를 1개 이상 선택해 주세요', 'err');
    return mutate('applyTemplate', {data: {templateId: o.templateId, baseDate: o.baseDate, projectId: o.projectId, onCalendar: !!o.onCalendar,
      picks: rows.map(r => ({i: r.i, on: r.on, assigneeId: r.assigneeId, dueDate: r.due, startDate: r.start}))}}, `업무 ${n}개를 만들었습니다`);
  },
  leave: o => mutate('saveLeave', {data:o}, '휴가를 등록했습니다'),
  comp: o => mutate('saveComp', {data:o}, '대휴 발생을 등록했습니다'),
  project: o => mutate('saveProject', {data:o}, o.id ? '프로젝트를 저장했습니다' : '프로젝트를 등록했습니다'),
  member: o => mutate('saveMember', {data:o}, o.id ? '구성원 정보를 저장했습니다' : '구성원을 추가했습니다 (초기 PIN 1234)'),
  part: o => mutate('saveSettings', {data:o}, '설정을 저장했습니다'),
  calset: o => { S.calCache = {}; return mutate('saveSettings', {data:o}, '캘린더 연동을 저장했습니다'); },
  target: o => mutate('saveSettings', {data:{['salesTarget_' + S.salesYear]: o.target}}, '목표를 저장했습니다')
};

function formData(f){
  const o = {};
  new FormData(f).forEach((v, k) => { o[k] = v; });
  const groups = {};
  f.querySelectorAll('input[type=checkbox][name]').forEach(c => { (groups[c.name] = groups[c.name] || []).push(c); });
  Object.entries(groups).forEach(([n, cs]) => {
    if (cs.every(c => c.disabled)) return;
    o[n] = cs.length > 1 || cs[0].getAttribute('value') ? cs.filter(c => c.checked).map(c => c.value) : cs[0].checked;
  });
  f.querySelectorAll('[data-money][name]').forEach(i => { if (!i.disabled) o[i.name] = num(i.value); });
  return o;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const ctrl = e.target.closest('select,input,textarea,label,a[href]');
  if (ctrl && ctrl !== el && el.contains(ctrl)) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(el.dataset, el, e); }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeModal();
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && e.target.id === 'chatInput') { e.preventDefault(); sendChat(); return; }
  if (e.key === 'Enter' && !e.isComposing && e.target.id === 'ckNew') { e.preventDefault(); ACTIONS.ckAdd(); }
  if (e.key === 'Enter' && !e.isComposing && e.target.id === 'lnUrl') { e.preventDefault(); ACTIONS.lnAdd(); }
});

document.addEventListener('submit', async e => {
  const f = e.target, fn = FORMS[f.dataset.form];
  if (!fn) return;
  e.preventDefault();
  const btn = f.querySelector('button.primary') || (f.id ? document.querySelector(`button[form="${f.id}"]`) : null);
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  try { await fn(formData(f), f); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-money]')) { const raw = t.value.replace(/[^\d]/g, ''); t.value = raw ? Number(raw).toLocaleString('ko-KR') : ''; }
  if (t.dataset.lfilter) { S.libF[t.dataset.lfilter] = t.value; const box = $('#libBody'); if (box) box.innerHTML = libList(); }
  if (t.dataset.cfilter) { S.ctF[t.dataset.cfilter] = t.value; const box = $('#ctBody'); if (box) box.innerHTML = ctList(); }
  if (t.dataset.tf && S.tpl) S.tpl[t.dataset.tf] = t.value;
  if (t.dataset.ti != null && S.tpl) {
    const it = S.tpl.items[+t.dataset.ti], k = t.dataset.tk;
    if (it) {
      if (k === 'dir') it.offset = Number(t.value) * (Math.abs(it.offset) || 1) * (t.value === '0' ? 0 : 1);
      else if (k === 'days') it.offset = Math.sign(it.offset || -1) * Math.max(1, Math.round(num(t.value)) || 1);
      else if (k === 'duration') it.duration = Math.max(1, Math.round(num(t.value)) || 1);
      else it[k] = t.value;
    }
  }
  if (t.id === 'tplBase') { const tb = $('#tplRows'); if (tb) tb.innerHTML = tplApplyRows(); }
  if (t.hasAttribute('data-repnote')) {
    const R = weekRange(S.repWeek); LS.set(repNoteKey(R), t.value);
    const out = $('#repOut'); if (out) out.value = buildReport(R, S.repMode, repIds(), t.value).text;
  }
  if (t.id === 'chatInput') { S.chatDraft = t.value; t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
  if (t.dataset.tfilter) { S.taskF[t.dataset.tfilter] = t.value; const box = $('#taskBody'); if (box) box.innerHTML = taskBody(); }
  if (t.dataset.filter) { S.salesFilter[t.dataset.filter] = t.value; const box = $('#salesTable'); if (box) box.innerHTML = salesTable(); }
  const f = t.form;
  if (f && f.dataset.form === 'leave') updateLeavePreview(f);
  if (f && f.dataset.form === 'project') updateProjectCalc(f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg) { S[t.dataset.chg] = t.value; render(); return; }
  if (t.hasAttribute('data-repdate')) { if (isDate(t.value)) { S.repDates[weekRange(S.repWeek).from] = t.value; render(); } return; }
  if (t.hasAttribute('data-rephead')) { S.repHead = t.checked; render(); return; }
  if (t.id === 'libFile') { setLibFile(t.files && t.files[0]); return; }
  if (t.dataset.tk === 'dir' && S.tpl) { $('#tplItems').innerHTML = tplItemsHtml(); return; }
  if (t.id === 'tplShift' || t.id === 'tplBase') { const tb = $('#tplRows'); if (tb) tb.innerHTML = tplApplyRows(); return; }
  if (t.dataset.tp != null && S.tplApply) { S.tplApply.picks[+t.dataset.tp].on = t.checked; tplApplyRows(); return; }
  if (t.dataset.tpa != null && S.tplApply) { S.tplApply.picks[+t.dataset.tpa].assigneeId = t.value; return; }
  if (t.dataset.status) { const x = S.data.tasks.find(y => y.id === t.dataset.status); if (x) setTaskStatus(x, t.value); return; }
  if (t.dataset.ck != null && S.draft) { S.draft.checklist[+t.dataset.ck].d = t.checked; draftChanged(); return; }
  if (t.dataset.ms) { const m = (S.data.milestones || []).find(y => y.id === t.dataset.ms); if (m) quiet('saveMilestone', {data: Object.assign({}, m, {done: t.checked})}, t.checked ? '마일스톤을 완료했습니다' : '완료를 취소했습니다'); return; }
  if (t.hasAttribute('data-projdone')) { S.projShowDone = t.checked; render(); return; }
  const f = t.form;
  if (f && f.dataset.form === 'leave') updateLeavePreview(f);
});

/* 업무 카드 끌어서 옮기기 */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]');
  if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const dz = e.target.closest && e.target.closest('#libDrop');
  if (dz) { e.preventDefault(); dz.classList.add('over'); return; }
  const col = e.target.closest && e.target.closest('[data-drop]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(x => { if (x !== col) x.classList.remove('over'); });
  col.classList.add('over');
});
document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('#libDrop'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => {
  const dz = e.target.closest && e.target.closest('#libDrop');
  if (dz) { e.preventDefault(); dz.classList.remove('over'); setLibFile(e.dataTransfer.files && e.dataTransfer.files[0]); return; }
  const col = e.target.closest && e.target.closest('[data-drop]');
  if (!col) return;
  e.preventDefault(); col.classList.remove('over');
  const x = S.data.tasks.find(t => t.id === e.dataTransfer.getData('text/plain'));
  if (x) setTaskStatus(x, col.dataset.drop);
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chatActive()) chatTick(); });
window.addEventListener('hashchange', () => { S.route = location.hash.slice(1) || 'home'; if (S.data) { render(); window.scrollTo(0, 0); } });

boot();
</script>
</body>
</html>
